<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M1 Dashboard — Redesign Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=Inter+Tight:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css?v=2">
<link rel="stylesheet" href="styles/components.css?v=4">
<link rel="stylesheet" href="styles/premium.css?v=3">
<link rel="stylesheet" href="styles/bold.css?v=2">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main id="view"></main>
  </div>
</div>

<div class="cmdk-wrap" id="cmdk" role="dialog" aria-label="Command palette">
  <div class="cmdk">
    <div class="cmdk-in">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="cmdk-input" placeholder="Search clients, pages, people, or ask Claude…" autocomplete="off">
      <kbd>esc</kbd>
    </div>
    <div id="cmdk-list"></div>
    <div class="cmdk-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>⌘</kbd> <kbd>K</kbd> toggle</span><span style="margin-left:auto">Tip: type a client name to jump straight to its hub</span></div>
  </div>
</div>

<script src="app.js?v=7"></script>
</body>
</html>
